name: Compiler phase 1 frontend and typed IR checks

on:
  pull_request:
  push:
    branches:
      - compiler/pr31-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexer-and-parser:
    name: Lexer/parser/typed-IR regressions (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute focused frontend tests
        run: |
          set -euxo pipefail
          make clean
          make CC=${{ matrix.compiler }} test-lexer-safety test-parser-variables test-parser-statistics test-ast-validation test-canonical-compiler test-functions test-ir-validation

  lexer-sanitizers:
    name: Frontend and typed IR ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute lexer safety tests under sanitizers
        run: |
          set -euxo pipefail
          make clean
          make CC=clang \
            CFLAGS='-std=c17 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude' \
            LDFLAGS='-fsanitize=address,undefined -lm -pthread' \
            test-lexer-safety test-parser-variables test-parser-statistics test-ast-validation test-canonical-compiler test-functions test-ir-validation
