name: Grouped spill million-row validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-spill-million-row:
    name: Canonical grouped spill (1,000,000 rows)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Build canonical Milena binary
        run: make all
      - name: Run deterministic one-million-row parity workload
        env:
          CC: gcc
        run: |
          mkdir -p artifacts
          python3 benchmarks/grouped_spill_benchmark.py \
            --large-rows 1000000 \
            --repetitions 3 \
            --output artifacts/grouped-spill-million-row.json
      - name: Upload reproducible workload observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-spill-million-row-${{ github.sha }}
          path: artifacts/grouped-spill-million-row.json
          if-no-files-found: warn
          retention-days: 30
