name: Validate Milena on a real Termux aarch64 runner

on:
  workflow_dispatch:
    inputs:
      confirm_device:
        description: 'Confirmar que el runner etiquetado es un dispositivo Termux/aarch64 real'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag de una Release existente a la que se subirán los artefactos (opcional)'
        required: false
        type: string
        default: ''
      apt_repository:
        description: 'URL HTTPS de un repositorio APT ya configurado en el runner (opcional; no se inventa ninguno)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# This is deliberately manual. The labels select an already registered device;
# GitHub Actions cannot emulate Termux by assigning labels to an Ubuntu runner.
jobs:
  termux-aarch64-contract:
    if: inputs.confirm_device == true
    runs-on: [self-hosted, termux, aarch64, milena]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight real runner identity
        shell: bash
        run: ./scripts/termux-runner-preflight.sh

      - name: Build the native Termux package
        shell: bash
        run: ./packaging/termux/build-local-deb.sh

      - name: Validate package metadata, ELF and checksum
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist/termux -maxdepth 1 -type f -name 'milena_*_aarch64.deb' -print -quit)"
          test -n "$package"
          python3 scripts/validate_termux_artifact.py "$package" --checksum "$package.sha256"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --fsys-tarfile "$package" | tar -xOf - ./data/data/com.termux/files/usr/bin/milena > "$tmp/milena"
          python3 scripts/validate_termux_elf.py "$tmp/milena"
          test "$(dpkg-deb -f "$package" Architecture)" = aarch64
          test "$(dpkg-deb -f "$package" Package)" = milena

      - name: Run local pkg/dpkg smoke and optional configured APT smoke
        shell: bash
        env:
          MILENA_APT_REPOSITORY: ${{ inputs.apt_repository }}
        run: |
          set -euo pipefail
          package="$(find dist/termux -maxdepth 1 -type f -name 'milena_*_aarch64.deb' -print -quit)"
          ./scripts/termux-real-smoke.sh "$package" "${MILENA_APT_REPOSITORY:-}"

      - name: Upload real-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: milena-termux-aarch64-contract-${{ github.run_id }}
          path: |
            artifacts/termux-runner/preflight.txt
            artifacts/termux-runner/smoke.txt
            dist/termux/*.deb
            dist/termux/*.sha256
            dist/termux/*.provenance.json
          if-no-files-found: error

      # Supplying a tag is an explicit operator decision. The tag must already
      # exist; this contract never fabricates a release or a download URL.
      - name: Upload verified package to an existing GitHub Release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.release_tag }}" \
            dist/termux/*.deb dist/termux/*.sha256 dist/termux/*.provenance.json \
            --repo "$GITHUB_REPOSITORY" --clobber
