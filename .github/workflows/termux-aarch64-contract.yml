name: Validate Milena on a real Termux aarch64 runner

on:
  workflow_dispatch:
    inputs:
      confirm_device:
        description: 'Confirmar que el runner etiquetado es un dispositivo Termux/aarch64 real'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# This is deliberately manual. The labels select an already registered device;
# GitHub Actions cannot emulate Termux by assigning labels to an Ubuntu runner.
jobs:
  termux-aarch64-contract:
    if: inputs.confirm_device == true
    runs-on: [self-hosted, termux, aarch64, milena]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight real runner identity
        shell: bash
        run: ./scripts/termux-runner-preflight.sh

      - name: Build the native Termux package
        shell: bash
        run: ./packaging/termux/build-local-deb.sh

      - name: Validate package metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist/termux -maxdepth 1 -type f -name 'milena_*_aarch64.deb' -print -quit)"
          test -n "$package"
          python3 scripts/validate_termux_artifact.py "$package" \
            --checksum "$package.sha256"
          test "$(dpkg-deb -f "$package" Architecture)" = aarch64
          test "$(dpkg-deb -f "$package" Package)" = milena

      - name: Upload real-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: milena-termux-aarch64-contract-${{ github.run_id }}
          path: |
            artifacts/termux-runner/preflight.txt
            dist/termux/*.deb
            dist/termux/*.sha256
          if-no-files-found: error
