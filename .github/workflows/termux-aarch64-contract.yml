name: Validate Milena on a real Termux aarch64 runner

on:
  workflow_dispatch:
    inputs:
      confirm_device:
        description: 'Confirmar que el runner etiquetado es un dispositivo Termux/aarch64 real'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag de una Release existente a la que se subirán los artefactos (opcional)'
        required: false
        type: string
        default: ''
      apt_repository:
        description: 'URL HTTPS de un repositorio APT ya configurado en el runner (opcional)'
        required: false
        type: string
        default: ''
      run_10gb_gate:
        description: 'Ejecutar en el dispositivo real la prueba sintética de 10 GB y spill (requiere espacio libre)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: termux-aarch64-contract
  cancel-in-progress: false

# Manual and fail-closed: labels never emulate Android. The selected host must
# already be a registered Termux device and must have a shallow/sparse official
# termux-packages checkout in TERMUX_PACKAGES_DIR.
jobs:
  termux-host-contract:
    # This is deliberately host-only: it proves the canonical C17 source and
    # CLI contract, but does not claim Android/Bionic execution.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar contrato reproducible del binario canónico
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang
          make termux-contract CC=clang

  termux-aarch64-contract:
    if: inputs.confirm_device == true
    runs-on: [self-hosted, termux, aarch64, milena]
    timeout-minutes: 120
    steps:
      - name: Checkout Milena
        uses: actions/checkout@v4

      - name: Install candidate recipe into official checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TERMUX_PACKAGES_DIR:-}"
          test -x "$TERMUX_PACKAGES_DIR/build-package.sh"
          rm -rf "$TERMUX_PACKAGES_DIR/packages/milena"
          mkdir -p "$TERMUX_PACKAGES_DIR/packages/milena"
          cp -R packaging/termux-packages/milena/. "$TERMUX_PACKAGES_DIR/packages/milena/"
          python3 scripts/validate_termux_recipe.py \
            "$TERMUX_PACKAGES_DIR/packages/milena/build.sh" \
            --official-dir "$TERMUX_PACKAGES_DIR"

      - name: Preflight real runner identity
        shell: bash
        run: ./scripts/termux-runner-preflight.sh

      - name: Build with official termux-packages build-package.sh
        shell: bash
        run: |
          set -euo pipefail
          cd "$TERMUX_PACKAGES_DIR"
          # On-device build-package.sh determines the architecture itself;
          # preflight already proved this is aarch64.
          ./build-package.sh -I -f milena
          package="$(find . -type f -name 'milena_*_aarch64.deb' -print -quit)"
          test -n "$package"
          mkdir -p "$GITHUB_WORKSPACE/dist/termux"
          cp "$package" "$GITHUB_WORKSPACE/dist/termux/"

      - name: Validate package metadata, ELF and checksum
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist/termux -maxdepth 1 -type f -name 'milena_*_aarch64.deb' -print -quit)"
          test -n "$package"
          sha256sum "$package" > "$package.sha256"
          python3 scripts/validate_termux_artifact.py "$package" --checksum "$package.sha256"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --fsys-tarfile "$package" | tar -xOf - ./data/data/com.termux/files/usr/bin/milena > "$tmp/milena"
          python3 scripts/validate_termux_elf.py "$tmp/milena"
          test "$(dpkg-deb -f "$package" Architecture)" = aarch64
          test "$(dpkg-deb -f "$package" Package)" = milena

      - name: Run pkg install, upgrade and remove on Android
        # termux-real-smoke.sh executes pkg install, pkg upgrade and pkg remove.
        shell: bash
        env:
          MILENA_APT_REPOSITORY: ${{ inputs.apt_repository }}
        run: |
          set -euo pipefail
          package="$(find dist/termux -maxdepth 1 -type f -name 'milena_*_aarch64.deb' -print -quit)"
          ./scripts/termux-real-smoke.sh "$package" "${MILENA_APT_REPOSITORY:-}"

      - name: Run opt-in 10 GB grouped-spill gate on real Termux
        if: inputs.run_10gb_gate == true
        shell: bash
        env:
          CC: clang
          MILENA_BIN: ${{ github.workspace }}/milena
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_device }}" = "true"
          test "$(uname -m)" = "aarch64"
          mkdir -p artifacts/termux-runner
          make clean
          make TERMUX=1 CC=clang all
          ./milena --self-check | grep -Fq 'Milena self-check: OK'
          export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
          mkdir -p "$TMPDIR"
          {
            uname -a
            printf 'PREFIX=%s\n' "$PREFIX"
            if command -v getprop >/dev/null 2>&1; then
              getprop ro.build.version.release
            fi
            clang --version | head -n 1
            python3 --version
            df -h "$TMPDIR"
          } > artifacts/termux-runner/large-file-environment.txt
          python3 benchmarks/grouped_spill_benchmark.py \
            --large-file-bytes 10000000000 \
            --large-file-rows 1000000 \
            --large-file-groups 1000 \
            --large-file-repetitions 1 \
            --repetitions 1 \
            --output artifacts/termux-runner/grouped-spill-ten-gb.json

      - name: Upload real-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: milena-termux-aarch64-contract-${{ github.run_id }}
          path: |
            artifacts/termux-runner/preflight.txt
            artifacts/termux-runner/toolchain.txt
            artifacts/termux-runner/workspace-sha256.txt
            artifacts/termux-runner/smoke.txt
            artifacts/termux-runner/large-file-environment.txt
            artifacts/termux-runner/grouped-spill-ten-gb.json
            dist/termux/*.deb
            dist/termux/*.sha256
          if-no-files-found: warn

      - name: Upload verified package to an existing GitHub Release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.release_tag }}" \
            dist/termux/*.deb dist/termux/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
