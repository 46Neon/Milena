name: Build Mano release artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make dpkg-dev

      - name: Build and test Debian package
        run: ./packaging/debian/build-local-deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: mano-debian-amd64
          path: dist/debian/*.deb

  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Build Windows executable
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: milena-windows-x64
          path: dist/windows/milena.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mano-debian-amd64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: milena-windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
